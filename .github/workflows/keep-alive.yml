name: Keep DevIntel Engine Awake

on:
  schedule:
    # Ping every 10 minutes to prevent Render free tier from sleeping (15 min inactivity timer)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Cloud Engine
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          echo "Pinging DevIntel Cloud Engine..."
          curl -f -s -S https://devintel-6ebi.onrender.com/health
          echo "Engine is warm and active."
