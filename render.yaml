services:
  - type: web
    name: devintel-backend
    env: python
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PROJECT_NAME
        value: "DevIntel V1"
      - key: PYTHON_VERSION
        value: "3.11.9"
